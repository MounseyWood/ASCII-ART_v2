                                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                                    
                                    // For browsers without iframe screenshot capability, 
                                    // add a notice about HTML download
                                    ctx.fillStyle = textColorInput.value;
                                    ctx.font = fontSizeSlider.value + 'px monospace';
                                    
                                    // Draw each line of ASCII art text
                                    const lines = processedAscii.text.split('\n');
                                    const lineHeight = parseFloat(lineHeightSlider.value) * fontSizeSlider.value;
                                    
                                    for (let i = 0; i < lines.length; i++) {
                                        ctx.fillText(lines[i], 15, 15 + (i * lineHeight));
                                    }
                                    
                                    // Add notice about colors
                                    ctx.fillStyle = 'rgba(0,0,0,0.7)';
                                    ctx.fillRect(10, canvas.height - 40, canvas.width - 20, 30);
                                    ctx.fillStyle = 'white';
                                    ctx.font = '12px sans-serif';
                                    ctx.fillText('Note: Download as HTML to preserve all colors perfectly', 20, canvas.height - 20);
                                    
                                    saveCanvas(canvas);
                                    cleanup(iframe);
                                } catch (e) {
                                    console.error('Error creating canvas from iframe:', e);
                                    showFallbackMessage();
                                    cleanup(iframe);
                                }
                            }, 500);
                        } catch (e) {
                            console.error('Fallback method error:', e);
                            showFallbackMessage();
                            cleanup();
                        }
                    }
                    
                    function saveCanvas(canvas) {
                        try {
                            const dataURL = canvas.toDataURL('image/png');
                            
                            // Create download link
                            const a = document.createElement('a');
                            a.href = dataURL;
                            a.download = 'ascii_art.png';
                            document.body.appendChild(a);
                            a.click();
                            document.body.removeChild(a);
                        } catch (e) {
                            console.error('Error saving canvas:', e);
                            showFallbackMessage();
                        }
                    }
                    
                    function cleanup(extraElement) {
                        try {
                            document.body.removeChild(container);
                            document.body.removeChild(loadingIndicator);
                            if (extraElement) document.body.removeChild(extraElement);
                        } catch (e) {
                            console.error('Cleanup error:', e);
                        }
                    }
                    
                    function showFallbackMessage() {
                        alert('Could not generate a colored PNG. For best results with all colors, please use the "Download as HTML" option instead.');
                        cleanup();
                    }
                } catch (error) {
                    console.error('Overall PNG generation error:', error);
                    alert('Error generating PNG. Please use the HTML download option for best results with colors.');
                    document.body.removeChild(loadingIndicator);
                }
            });

            // Download as GIF
            downloadGifBtn.addEventListener('click', function() {
                // Validate ASCII art is available
                if (!processedAscii) {
                    alert('Please convert an image to ASCII art first.');
                    return;
                }

                // Show loading indicator
                const loadingIndicator = createLoadingIndicator('Generating GIF...');

                try {
                    // Create canvas with rendered ASCII art
                    const canvas = createAsciiCanvas();

                    // Export as GIF
                    exportCanvasAsGif(canvas, loadingIndicator);
                } catch (error) {
                    console.error('Error generating GIF:', error);
                    removeLoadingIndicator(loadingIndicator);
                    alert('Error generating GIF: ' + error.message);
                }
            });

            // Initialize UI
            window.addEventListener('resize', function() {
                adjustMaskingCanvas();
                resizeAsciiOutput();
            });
            
            function resizeAsciiOutput() {
                // Adjust font size based on container width
                const containerWidth = document.querySelector('.output-section').offsetWidth;
                const fontSize = Math.max(6, Math.min(16, containerWidth / 100));
                if (window.innerWidth < 768) {
                    asciiOutput.style.fontSize = fontSize + 'px';
                }
            }
        });
    </script>
</body>
</html>
